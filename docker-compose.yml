version: "3.9"

# ── Named volumes for persistent monitoring data ──────────────────────────────
volumes:
  prometheus_data:
  grafana_data:

# ── Shared network ────────────────────────────────────────────────────────────
networks:
  brain_tumor_net:
    driver: bridge

# ── Services ──────────────────────────────────────────────────────────────────
services:

  # ── FastAPI inference API ──────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: brain-tumor-api:latest
    container_name: brain-tumor-api
    networks:
      - brain_tumor_net
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - WANDB_API_KEY=${WANDB_API_KEY:-}
      - WANDB_PROJECT=${WANDB_PROJECT:-brain-tumor-classification}
      - WANDB_ENTITY=${WANDB_ENTITY:-}
      - API_HOST=0.0.0.0
      - API_PORT=8000
    volumes:
      - ./data/processed:/app/data/processed:ro
      - ./models:/app/models:ro
      - ./data/logs:/app/data/logs
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ── Streamlit frontend ─────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    image: brain-tumor-frontend:latest
    container_name: brain-tumor-frontend
    networks:
      - brain_tumor_net
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - API_URL=http://api:8000
      - PYTHONPATH=/app/src
    volumes:
      - ./data/processed:/app/data/processed:ro
      - ./models:/app/models:ro
      - ./data/raw:/app/data/raw:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ── Prometheus metrics scraper ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: brain-tumor-prometheus
    networks:
      - brain_tumor_net
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--storage.tsdb.retention.time=15d"
    depends_on:
      - api
    restart: unless-stopped

  # ── Grafana dashboards ─────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: brain-tumor-grafana
    networks:
      - brain_tumor_net
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=localhost
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped