    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    # Pinned <3 because pandas 3.0 makes ArrowStringArray the default backing
    # for string columns, which segfaults on Windows when used alongside
    # torch+CUDA (pyarrow DLL conflict). pandas 2.x stores strings as object
    # dtype and avoids the issue entirely.
    "pandas>=2.2,<3",
    "pillow>=12.2.0",
    "pre-commit>=3.7,<4.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.13",
    "scikit-image>=0.26.0",
    "seaborn>=0.13.2",
    "tqdm>=4.67.3",
]
[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["mlops_project"]
