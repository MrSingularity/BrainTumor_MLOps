[project]
name = "brain-tumor-mlops"
version = "0.1.0"
description = "End-to-end MLOps pipeline for brain tumor detection on MRI (LGG)."
readme = "README.md"
authors = [
    { name = "nathan massicot", email = "nathan.massicot@efrei.net" }
]
requires-python = ">=3.12"
dependencies = [
    "albumentations>=2.0.8",
    "hydra-core>=1.3.2",
    "kaggle>=2.1.0",
    "omegaconf>=2.3.0",
    "pyarrow>=24.0.0",
    "python-dotenv>=1.2.2",
    "streamlit>=1.45.1",
    "scikit-learn>=1.8.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "wandb>=0.26.1",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
]

[project.scripts]
brain-tumor-mlops = "brain_tumor_mlops:main"

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dvc>=3.67.1",
    "dvc-gdrive>=3.0.1",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pillow>=12.2.0",
    "pytest>=9.0.3",
    "scikit-image>=0.26.0",
    "seaborn>=0.13.2",
    "tqdm>=4.67.3",
]
